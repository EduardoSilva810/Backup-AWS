<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JoJo Stand Archive</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jojo: "#8b5cf6",
                        darkbg: "#09090b",
                        cardbg: "#18181b"
                    }
                }
            }
        }
    </script>
</head>


<body class="bg-darkbg text-white min-h-screen">


    <!-- CABEÇALHO -->

    <header class="border-b border-gray-800 bg-cardbg">

        <div class="max-w-7xl mx-auto px-6 py-6">

            <h1 class="text-3xl font-bold text-jojo">
                ★ JOJO STAND ARCHIVE
            </h1>

            <p class="text-gray-400 mt-1">
                CRUD de personagens e Stands de JoJo's Bizarre Adventure
            </p>

        </div>

    </header>



    <!-- CONTEÚDO -->

    <main class="max-w-7xl mx-auto px-6 py-8">


        <!-- MÉTRICAS -->

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">


            <div class="bg-cardbg border border-gray-800 rounded-xl p-5">

                <p class="text-gray-400 text-sm">
                    Personagens cadastrados
                </p>

                <p
                    id="totalCharacters"
                    class="text-3xl font-bold mt-1"
                >
                    0
                </p>

            </div>



            <div class="bg-cardbg border border-gray-800 rounded-xl p-5">

                <p class="text-gray-400 text-sm">
                    Stands cadastrados
                </p>

                <p
                    id="totalStands"
                    class="text-3xl font-bold mt-1"
                >
                    0
                </p>

            </div>

        </div>



        <!-- CRUD -->

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">


            <!-- FORMULÁRIO -->

            <div class="lg:col-span-1">

                <div class="bg-cardbg border border-gray-800 rounded-xl p-6">


                    <h2
                        id="formTitle"
                        class="text-xl font-bold mb-6"
                    >
                        Cadastrar Personagem
                    </h2>



                    <form
                        id="characterForm"
                        class="space-y-4"
                    >


                        <!-- ID -->

                        <input
                            type="hidden"
                            id="characterId"
                        >



                        <!-- NOME DO PERSONAGEM -->

                        <div>

                            <label
                                for="characterName"
                                class="block text-sm text-gray-400 mb-2"
                            >
                                Nome do personagem
                            </label>

                            <input
                                type="text"
                                id="characterName"
                                required
                                placeholder="Ex: Jotaro Kujo"
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 outline-none focus:border-jojo"
                            >

                        </div>



                        <!-- NOME DO STAND -->

                        <div>

                            <label
                                for="standName"
                                class="block text-sm text-gray-400 mb-2"
                            >
                                Nome do Stand
                            </label>

                            <input
                                type="text"
                                id="standName"
                                required
                                placeholder="Ex: Star Platinum"
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 outline-none focus:border-jojo"
                            >

                        </div>



                        <!-- TIPO -->

                        <div>

                            <label
                                for="standType"
                                class="block text-sm text-gray-400 mb-2"
                            >
                                Tipo do Stand
                            </label>

                            <select
                                id="standType"
                                required
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 outline-none focus:border-jojo"
                            >

                                <option value="">
                                    Selecione o tipo
                                </option>

                                <option value="Humanoide">
                                    Humanoide
                                </option>

                                <option value="Longa Distância">
                                    Longa Distância
                                </option>

                                <option value="Automático">
                                    Automático
                                </option>

                                <option value="Colônia">
                                    Colônia
                                </option>

                                <option value="Objeto">
                                    Objeto
                                </option>

                            </select>

                        </div>



                        <!-- PODER DESTRUTIVO -->

                        <div>

                            <label
                                for="destructivePower"
                                class="block text-sm text-gray-400 mb-2"
                            >
                                Poder Destrutivo
                            </label>

                            <select
                                id="destructivePower"
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3"
                            >

                                <option value="∞">∞</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>

                            </select>

                        </div>



                        <!-- VELOCIDADE -->

                        <div>

                            <label
                                for="speed"
                                class="block text-sm text-gray-400 mb-2"
                            >
                                Velocidade
                            </label>

                            <select
                                id="speed"
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3"
                            >

                                <option value="∞">∞</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>

                            </select>

                        </div>



                        <!-- ALCANCE -->

                        <div>

                            <label
                                for="range"
                                class="block text-sm text-gray-400 mb-2"
                            >
                                Alcance
                            </label>

                            <select
                                id="range"
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3"
                            >

                                <option value="∞">∞</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>

                            </select>

                        </div>



                        <!-- DURABILIDADE -->

                        <div>

                            <label
                                for="durability"
                                class="block text-sm text-gray-400 mb-2"
                            >
                                Durabilidade
                            </label>

                            <select
                                id="durability"
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3"
                            >

                                <option value="∞">∞</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>

                            </select>

                        </div>



                        <!-- PRECISÃO -->

                        <div>

                            <label
                                for="precision"
                                class="block text-sm text-gray-400 mb-2"
                            >
                                Precisão
                            </label>

                            <select
                                id="precision"
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3"
                            >

                                <option value="∞">∞</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>

                            </select>

                        </div>



                        <!-- POTENCIAL -->

                        <div>

                            <label
                                for="development"
                                class="block text-sm text-gray-400 mb-2"
                            >
                                Potencial de Desenvolvimento
                            </label>

                            <select
                                id="development"
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3"
                            >

                                <option value="∞">∞</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>

                            </select>

                        </div>



                        <!-- BOTÕES -->

                        <div class="flex gap-3 pt-3">

                            <button
                                type="button"
                                id="cancelBtn"
                                class="hidden flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-lg"
                            >
                                Cancelar
                            </button>


                            <button
                                type="submit"
                                id="submitBtn"
                                class="flex-1 bg-jojo hover:opacity-90 py-3 rounded-lg font-semibold"
                            >
                                Cadastrar
                            </button>

                        </div>

                    </form>

                </div>

            </div>



            <!-- LISTA DE PERSONAGENS -->

            <div class="lg:col-span-2">

                <div
                    id="characterGrid"
                    class="grid grid-cols-1 md:grid-cols-2 gap-5"
                >
                </div>

            </div>

        </div>

    </main>



    <!-- JAVASCRIPT -->

    <script src="trabalhojs.js"></script>

</body>

</html>
