<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arena RPG</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Nosso CSS -->
    <link rel="stylesheet" href="rpgteste.css"
</head>

<body>

    <div class="container py-4">

        <!-- Titulo -->
        <h1 class="texto1">
            ⚔️ Arena RPG
        </h1>

        <!-- Status -->
        <div class="row g-4">

            <!-- Jogador -->
            <div class="col-md-6">
                <div class="card bg-dark text-white">
                    <div class="card-body">

                        <h2>🧙 Herói</h2>

                        <p>
                            Nível:
                            <span id="player-level">1</span>
                        </p>

                        <p> ❤️ Vida</p>

                        <div class="progress mb-3">
                            <div 
                                id="player-hp"
                                class="progress-bar bg-danger"
                                style="width: 100%"
                            >
                                100 / 100
                            </div>
                        </div>

                        <p>🔵 Mana</p>

                        <div class="progress">
                            <div 
                                id="player-mana"
                                class="proress-bar bg-primary"
                                style="width: 100%"
                            >
                                50 / 50
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- INIMIGO -->
            <div class="col-md-6">
                <div class="card bg-dark text-white">
                    <div class="card-body">

                        <h2>👹 Goblin</h2>

                        <p>❤️ Vida</p>

                        <div class="progress">
                            <div 
                                id="enemy-hp"
                                class="progress-bar bg-danger"
                                style="width: 100%"
                            >
                                80 / 80
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>

        <!-- AÇOES -->
        <div class="card bg-dark text-white mt-4">
            <div class="card-body">

                <h3>⚔️ Ações</h3>

                <div class="d-flex flex-wrap gap-2">

                    <button
                        class="btn btn-danger"
                        onclick="aracar()"
                    >
                        ⚔️ Atacar
                    </button>

                    <button
                        class="btn btn-primary"
                        onclick="bolaDeFogo()"
                    >
                        🔥 Bola de Fogo
                    </button>

                    <button
                        class="btn btn-success"
                        onclick="curar()"
                    >
                        💚 Curar
                    </button>

                    <button
                        class="btn btn-secondary"
                        onclick="defender()"
                    >
                        🛡️ Defender
                    </button>

                </div>

            </div>
        </div>

        <!-- LOG -->
        <div class="card bg-dark text-white mt-4">
            <div class="card-body">

                <h3>📜 Batalha</h3>

                <div id="battle-log">
                    <p>⚔️ A batalha começou!</p>
                </div>

            </div>
        </div>

        <!-- REINICIAR -->
        <div class="text-center mt-4">

            <button
                class="btn btn-warning"
                onclick="reiniciarJogo()"
            >
                🔄 Novo jogo
            </button>

        </div>

    </div>

    <script src="rpgteste.js"></script>

</body>
</html>
