  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

      <a class="navbar-brand" href="index.html">Exemplo 2</a>

        <span class="navbar-toggler-icon"></span>
      </button>

        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>

  <div class="container my-5">
    <h1 class="mb-3">Tabela com busca e paginação</h1>

    <div class="mb-3" style="max-width: 300px;">
      <input type="text" class="form-control" id="busca" placeholder="Buscar por nome ou cidade...">
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Cidade</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo"></tbody>
      </table>
    </div>

    <nav>
      <ul class="pagination justify-content-center" id="paginacao"></ul>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const dados = [
      { nome: 'Maria Silva', cidade: 'São Paulo', status: 'Ativo' },
      { nome: 'João Souza', cidade: 'Rio de Janeiro', status: 'Ativo' },
      { nome: 'Ana Lima', cidade: 'Belo Horizonte', status: 'Pendente' },
      { nome: 'Carlos Pereira', cidade: 'Curitiba', status: 'Inativo' },
      { nome: 'Fernanda Costa', cidade: 'Salvador', status: 'Ativo' },
      { nome: 'Pedro Alves', cidade: 'Porto Alegre', status: 'Ativo' },
      { nome: 'Juliana Rocha', cidade: 'São Paulo', status: 'Pendente' },
      { nome: 'Rafael Nunes', cidade: 'Recife', status: 'Inativo' },
      { nome: 'Beatriz Moura', cidade: 'Fortaleza', status: 'Ativo' },
      { nome: 'Lucas Ramos', cidade: 'Manaus', status: 'Ativo' },
      { nome: 'Camila Dias', cidade: 'Belo Horizonte', status: 'Pendente' },
      { nome: 'Diego Farias', cidade: 'Goiânia', status: 'Ativo' }
    ];

    const porPagina = 5;
    let paginaAtual = 1;

    const corporTabela = document.getElementById('tabelaCorpo');
    const paginacao = document.getElementById('paginacao');
    const busca = document.getElementById('busca');

    function filtrar() {
      const termo = busca.value.toLowerCase();
      return dados.filter(function (d) {
        return d.nome.toLowerCase().includes(termo) ||
               d.cidade.toLowerCase().includes(termo) ||
               d.status.toLowerCase().includes(termo);
      });
    }

    function desenhar() {
      const linhas = filtrar();
      const totalPaginas = Math.max(1, Math.ceil(linhas.length / porPagina));
      if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;

      const inicio = (paginaAtual - 1) * porPagina;
      const pagina = linhas.slice(inicio, inicio + porPagina);

      corporTabela.innerHTML = pagina.map(function (d, i) {
        const badge = d.status === 'Ativo' ? 'bg-success' : d.status === 'Pendente' ? 'bg-warning text-dark' : 'bg-danger';
        return '<tr>' +
          '<td>' + (inicio + i + 1) + '</td>' +
          '<td>' + d.nome + '</td>' +
          '<td>' + d.cidade + '</td>' +
          '<td><span class="badge ' + badge + '">' + d.status + '</span></td>' +
          '<td><button class="btn btn-sm btn-outline-primary" onclick="alert(\'Editar: ' + d.nome + '\')">Editar</button>' +
          ' <button class="btn btn-sm btn-outline-danger" onclick="alert(\'Excluir: ' + d.nome + '\')">Excluir</button></td>' +
          '</tr>';
      }).join('');

      if (linhas.length === 0) {
        corporTabela.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Nenhum resultado encontrado.</td></tr>';
      }

      desenharPaginacao(totalPaginas);
    }

    function desenharPaginacao(totalPaginas) {
      let itens = '';
      if (paginaAtual > 1) {
        itens += '<li class="page-item"><a class="page-link" href="#" onclick="mudarPagina(' + (paginaAtual - 1) + '); return false;">Anterior</a></li>';
      }
      for (let i = 1; i <= totalPaginas; i++) {
        itens += '<li class="page-item' + (i === paginaAtual ? ' active' : '') + '">' +
          '<a class="page-link" href="#" onclick="mudarPagina(' + i + '); return false;">' + i + '</a></li>';
      }
      if (paginaAtual < totalPaginas) {
        itens += '<li class="page-item"><a class="page-link" href="#" onclick="mudarPagina(' + (paginaAtual + 1) + '); return false;">Próxima</a></li>';
      }
      paginacao.innerHTML = itens;
    }

    window.mudarPagina = function (p) {
      paginaAtual = p;
      desenhar();
    };

    busca.addEventListener('input', function () {
      paginaAtual = 1;
      desenhar();
    });

    desenhar();
  </script>
</body>
</html>
