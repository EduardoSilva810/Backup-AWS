<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><title>Exemplos Tailwind CSS</title></head><body class="bg-gray-100 p-8"><div class="max-w-6xl mx-auto"><h1 class="text-4xl font-bold mb-8">Guia de Exemplos Tailwind CSS</h1><section class="mb-8"><h2 class="text-2xl font-bold">1. Botão Simples</h2><button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700 mt-2">Clique Aqui</button></section><section class="mb-8"><h2 class="text-2xl font-bold">2. Card</h2><div class="max-w-sm bg-white shadow-lg rounded-lg p-6"><h3 class="text-xl font-bold">Notebook Gamer</h3><p>Equipamento ideal para desenvolvimento.</p></div></section><section class="mb-8"><h2 class="text-2xl font-bold">3. Formulário</h2><form class="bg-white p-6 rounded shadow max-w-md"><input class="w-full border p-2 rounded mb-2" placeholder="E-mail"><input class="w-full border p-2 rounded mb-2" placeholder="Senha"><button class="w-full bg-blue-500 text-white p-2 rounded">Entrar</button></form></section><section class="mb-8"><h2 class="text-2xl font-bold">4. Grid Responsivo</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"><div class="bg-blue-200 p-4">Item 1</div><div class="bg-blue-200 p-4">Item 2</div><div class="bg-blue-200 p-4">Item 3</div><div class="bg-blue-200 p-4">Item 4</div></div></section><section class="mb-8"><h2 class="text-2xl font-bold">5. Dashboard</h2><div class="grid md:grid-cols-3 gap-4"><div class="bg-blue-500 text-white p-4 rounded">Usuários: 120</div><div class="bg-green-500 text-white p-4 rounded">Vendas: 85</div><div class="bg-red-500 text-white p-4 rounded">Alertas: 12</div></div></section></div></body></html>
